---
eda: true
automation_hub: true

containerized_install: true

# AAP minor version to install (2.5, 2.6, or 2.7). Also drives collection pins at preinit.
containerized_installer_version: "2.7"

containerized_installer_user: 'aap'
containerized_installer_user_home: '/home/aap'

agof_bootstrap_target: 'aws'
bootstrap_allowable_values:
  - aws

init_env_collection_install_force: false

# Config-as-code repo checkout: agof_cac_repo* takes precedence over agof_iac_repo*
agof_config_repo: "{{ agof_cac_repo | default(agof_iac_repo) }}"
agof_config_repo_version: "{{ agof_cac_repo_version | default(agof_iac_repo_version | default('main')) }}"

# Supported AAP minor releases for install + config-as-code.
agof_supported_aap_versions:
  - "2.5"
  - "2.6"
  - "2.7"

# Target AAP release. Set containerized_installer_version or aap_version in ~/agof_vault.yml.
# Normalized again at runtime in preinit/configure_aap after vault is loaded.
aap_version: "{{ containerized_installer_version | default('2.7') }}"

# Collection requirement file selected during preinit.
agof_aap_requirements_file: "requirements-aap-{{ aap_version }}.yml"

# EC2 instance type for the default AAP bootstrap node.
agof_aap_instance_type: "m5.2xlarge"
