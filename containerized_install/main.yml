# vim: ft=yaml.ansible
---
- name: "Prep the containerized installer (root required)"
  hosts: aap_controllers
  become: true
  gather_facts: true
  vars_files:
    - "../vars/main.yml"
    - "~/agof_vault.yml"
  vars:
    ansible_user: "{{ containerized_installer_user | default('aap') }}"
    ansible_remote_tmp: "{{ containerized_installer_user_home }}/.ansible/tmp"
  tasks:
    - name: AAP Containerized installer prereqs - packages and user setup
      ansible.builtin.include_role:
        name: installer_prereqs

- name: "Run the containerized installer"
  hosts: aap_controllers
  gather_facts: true
  vars_files:
    - "../vars/main.yml"
    - "~/agof_vault.yml"
  vars:
    ansible_user: "{{ containerized_installer_user | default('aap') }}"
    ansible_remote_tmp: "{{ containerized_installer_user_home }}/.ansible/tmp"
  tasks:
    - name: Install AAP
      ansible.builtin.include_role:
        name: installer

- name: "Remove sudo file for installer user"
  hosts: aap_controllers
  gather_facts: false
  vars_files:
    - "../vars/main.yml"
    - "~/agof_vault.yml"
  vars:
    ansible_user: "{{ containerized_installer_user | default('aap') }}"
  tasks:
    - name: Cleanup scaffolding after install
      ansible.builtin.include_role:
        name: installer_cleanup
      when: containerized_installer_cleanup | default(true) | bool
