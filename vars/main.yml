---
eda: true
automation_hub: true

containerized_install: true

containerized_installer_user: 'aap'
containerized_installer_user_home: '/home/aap'

agof_bootstrap_target: 'aws'
bootstrap_allowable_values:
  - aws

init_env_collection_install_force: false

# Config-as-code repo checkout: agof_cac_repo* takes precedence over agof_iac_repo*
agof_config_repo: "{{ agof_cac_repo | default(agof_iac_repo) }}"
agof_config_repo_version: "{{ agof_cac_repo_version | default(agof_iac_repo_version | default('main')) }}"
