---
automation_hub: false

ec2_name_prefix: "agof-vp-{{ (ansible_user_id | default('user'))[:5] }}"

pattern_name: '{{ ec2_name_prefix }}'

aap_hostname: 'aap.{{ pattern_name }}.{{ pattern_dns_zone }}'

# Optional vault tokens for config-as-code (preferred for AAP 2.6 and 2.7).
# When unset, a gateway token is bootstrapped from admin credentials before dispatch.
# aap_token_vault:
# hub_token_vault:

# Used only to bootstrap aap_token when aap_token_vault is not set.
aap_username: "{{ admin_user | default('admin') }}"
aap_password: "{{ admin_password }}"

# AAP minor version (2.6 or 2.7). Used for logging; collection pins come from preinit.
aap_version: "{{ containerized_installer_version | default('2.7') }}"

api_prefix: api/controller/v2

agof_configure_aap_debug: false
aap_request_timeout: 90
aap_configuration_async_dir: /tmp/.ansible_async

aap_validate_certs: false

perform_pre_config_fixups: true

agof_config_repo: "{{ agof_cac_repo | default(agof_iac_repo) }}"
agof_config_repo_version: "{{ agof_cac_repo_version | default(agof_iac_repo_version | default('main')) }}"

agof_config_repo_credentials_dir: "{{ '~/.agof/config-repo' | expanduser }}"
agof_config_repo_git_credentials_store_path: "{{ '~/.git-credentials' | expanduser }}"
agof_config_repo_home_known_hosts_path: "{{ '~/.ssh/known_hosts' | expanduser }}"
agof_config_repo_ssh_identity_candidates:
  - "{{ '~/.ssh/id_ed25519' | expanduser }}"
  - "{{ '~/.ssh/id_rsa' | expanduser }}"

# HTTPS authentication (non-OpenShift installs)
agof_config_repo_https_username: ""
agof_config_repo_ssh_accept_hostkey: false
agof_config_repo_ssh_extra_opts: ""

# Proxy settings for git checkout (also applied as http(s)_proxy / GIT_* env vars)
agof_config_repo_http_proxy: ""
agof_config_repo_https_proxy: ""
agof_config_repo_no_proxy: ""
agof_config_repo_all_proxy: ""
agof_config_repo_git_http_proxy: "{{ agof_config_repo_http_proxy }}"
agof_config_repo_git_https_proxy: "{{ agof_config_repo_https_proxy }}"

agof_config_repo_git_environment: >-
  {{
    {
      'http_proxy': agof_config_repo_http_proxy,
      'https_proxy': agof_config_repo_https_proxy,
      'HTTP_PROXY': agof_config_repo_http_proxy,
      'HTTPS_PROXY': agof_config_repo_https_proxy,
      'NO_PROXY': agof_config_repo_no_proxy,
      'no_proxy': agof_config_repo_no_proxy,
      'ALL_PROXY': agof_config_repo_all_proxy,
      'GIT_HTTP_PROXY': agof_config_repo_git_http_proxy,
      'GIT_HTTPS_PROXY': agof_config_repo_git_https_proxy,
    }
    | dict2items
    | selectattr('value', 'defined')
    | selectattr('value', 'ne', '')
    | items2dict
  }}
