---
- name: Resolve target AAP version from vault overrides
  ansible.builtin.set_fact:
    aap_version: "{{ (aap_version | default(containerized_installer_version | default('2.7'))) | string }}"

- name: Show AAP hostname
  ansible.builtin.debug:
    msg:
      - "aap_hostname: {{ aap_hostname }}"

- name: "Checkout config-as-code repository"
  ansible.builtin.include_tasks: checkout_config_repo.yml

- name: Show Git coordinates
  ansible.builtin.debug:
    msg:
      - "agof_config_repo: {{ agof_config_repo }}"
      - "agof_config_repo_version: {{ agof_config_repo_version }}"
      - "Checked out to: {{ agof_controller_config_dir }}"
      - "Git SHA before checkout: {{ git_checkout.before | default('n/a (new clone)') }}"
      - "Git SHA after checkout: {{ git_checkout.after | default('unknown') }}"

- name: Include vars from configs directory
  ansible.builtin.include_vars:
    dir: "{{ agof_controller_config_dir }}"
    ignore_unknown_extensions: true
    extensions:
      - "json"
      - "yaml"
      - "yml"
  tags:
    - always

- name: Wait for Automation Controller to be up
  ansible.builtin.uri:
    url: "https://{{ aap_hostname }}/{{ api_prefix }}/ping/"
    method: GET
    user: '{{ admin_user | default("admin") }}'
    password: "{{ admin_password }}"
    validate_certs: false
  register: check2
  until: check2.json is defined and check2.json.instances[0].capacity > 0 and check2.json.instance_groups[0].capacity > 0
  retries: 60
  delay: 10

- name: Display api ping results
  ansible.builtin.debug:
    msg: '{{ check2.json }}'

- name: Default to entitlement
  ansible.builtin.set_fact:
    entitle_aap: true

- name: Entitle AAP if needed
  block:
    # AAP will have an empty license_info block if it hasn't been entitled
    # of course we expect to entitle it through the containerized installer
    # But in case we didn't use the containerized installer, we have this check
    # and this block as a failsafe
    - name: Check on current license_info status
      ansible.builtin.uri:
        url: 'https://{{ aap_hostname }}/{{ api_prefix }}/config/'
        method: GET
        user: '{{ admin_user | default("admin") }}'
        password: "{{ admin_password }}"
        validate_certs: false
        force_basic_auth: true
      register: config_check

    - name: Debug license_info status
      ansible.builtin.debug:
        var: config_check

    - name: Turn off entitlement if needed
      ansible.builtin.set_fact:
        entitle_aap: false
      when:
        - config_check.json.license_info.valid_key

  rescue:
    - name: Notify that we are going to entitle
      ansible.builtin.debug:
        msg: "Caught an exception, entitling"

- name: Post manifest file if needed
  ansible.builtin.uri:
    url: 'https://{{ aap_hostname }}/{{ api_prefix }}/config/'
    method: POST
    user: '{{ admin_user | default("admin") }}'
    password: "{{ admin_password }}"
    body: '{ "eula_accepted": true, "manifest": "{{ manifest_content }}" }'
    body_format: json
    validate_certs: false
    force_basic_auth: true
  when: entitle_aap
  register: license_controller
  until: license_controller is not failed
  retries: 5

- name: Obtain config-as-code credentials for AAP 2.5
  ansible.builtin.include_tasks: obtain_aap_auth_25.yml
  when: aap_version is version('2.5', '==')

- name: Obtain platform gateway API tokens for config-as-code dispatch
  ansible.builtin.include_tasks: obtain_aap_gateway_token.yml
  when: aap_version is version('2.6', '>=')

- name: Show AAP version and auth mode for config-as-code
  ansible.builtin.debug:
    msg:
      - "aap_version: {{ aap_version }}"
      - "aap_hostname: {{ aap_hostname }}"
      - >-
        config-as-code auth: {{
          'token (source: ' ~ agof_aap_token_source ~ ')'
          if (agof_aap_auth_mode | default('token')) == 'token'
          else 'password (gateway username/password)'
        }}
      - "hub token: {{ 'yes (source: ' ~ agof_hub_token_source ~ ')' if hub_token is defined and hub_token | length > 0 else 'not set' }}"

- name: Debug infra.controller_configuration.dispatch common variables
  ansible.builtin.debug:
    msg:
      - "aap_hostname: {{ aap_hostname }}"
      - "aap_validate_certs: {{ aap_validate_certs }}"
      - "config-as-code auth mode: {{ agof_aap_auth_mode | default('token') }}"
      - "aap_token: {{ '(set, not logged)' if (agof_aap_auth_mode | default('token')) == 'token' else '(not used)' }}"
      - "aap_request_timeout: {{ aap_request_timeout }}"
      - "aap_configuration_async_dir: {{ aap_configuration_async_dir }}"
  when:
    - agof_configure_aap_debug

- name: Perform any necessary pre-config fixups
  when: perform_pre_config_fixups | bool
  ansible.builtin.include_role:
    name: agof_configure_aap/roles/pre_config_fixups

- name: "Configure AAP - Version 2.5+"
  block:
    - name: "Configure AAP"
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
