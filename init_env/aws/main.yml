---
# AWS specific initialization starts here
- name: "AWS specific initialization"
  hosts: build_control
  connection: local
  become: false
  vars_files:
    - "vars/aws_vars.yml"
    - "../vars/bootstrap_vars.yml"
    - "../../vars/main.yml"
    - "~/agof_vault.yml"
  vars:
    ec2_wait: true
  tasks:
    - name: collection final check
      block:
        - name: run AWS check setup if using AWS
          ansible.builtin.include_role:
            name: roles/aws_check_setup

      rescue:
        - name: Error with setup
          fail:
            msg: The provisioner has failed during initial check_setup, please scroll up to see exact error.

    - name: Provision network stuff
      ansible.builtin.include_role:
        name: roles/manage_ec2_infra

    - name: Include vars from previous runs
      ansible.builtin.include_vars:
        file: '{{ pattern_state_rootdir }}/{{ ec2_name_prefix }}/aws_state_vars.yml'
      ignore_errors: true
      when: save_aws_vars

    - name: Migrate legacy imagebuilder_ami state variable
      ansible.builtin.set_fact:
        rhel_ami_id: "{{ imagebuilder_ami }}"
      when:
        - rhel_ami_id is not defined or rhel_ami_id | length == 0
        - imagebuilder_ami is defined
        - imagebuilder_ami | length > 0

    - name: Resolve RHEL AMI ID
      when: rhel_ami_id is not defined or rhel_ami_id | length == 0
      block:
        - name: Look up latest RHEL AMI in target region
          amazon.aws.ec2_ami_info:
            owners:
              - "{{ rhel_ami_owner }}"
            filters:
              name: "{{ rhel_ami_name_filter }}"
              architecture: x86_64
              state: available
            region: "{{ ec2_region }}"
          register: rhel_amis

        - name: Assert matching RHEL AMIs were found
          ansible.builtin.assert:
            that:
              - rhel_amis.images | length > 0
            fail_msg: >-
              No RHEL AMI found in {{ ec2_region }} matching {{ rhel_ami_name_filter }}
              (owner {{ rhel_ami_owner }}). Try a different rhel_version or set rhel_ami_id_vault.

        - name: Set RHEL AMI ID from lookup
          ansible.builtin.set_fact:
            rhel_ami_id: "{{ (rhel_amis.images | sort(attribute='creation_date') | last).image_id }}"

    - name: Save variables for later if desired
      ansible.builtin.copy:
        content: |-
           ---
           ec2_name_prefix: '{{ ec2_name_prefix }}'
           ec2_region: '{{ ec2_region }}'
           ec2_vpc_id: '{{ ec2_vpc_id }}'
           ec2_vpc_subnet_id: '{{ ec2_vpc_subnet_id }}'

           pattern_dns_zone: '{{ pattern_dns_zone }}'

           rhel_ami_id: '{{ rhel_ami_id }}'
        dest: '{{ pattern_state_rootdir }}/{{ ec2_name_prefix }}/aws_state_vars.yml'
      when: save_aws_vars

    - name: Build VMs and manage DNS entries
      ansible.builtin.include_role:
        name: roles/manage_ec2_instances
      vars:
        ami_id: "{{ rhel_ami_id }}"

- name: Ensure AWS nodes are ready for post-provisioning
  hosts: aws_nodes
  become: true
  gather_facts: false
  vars_files:
    - "vars/aws_vars.yml"
    - "../vars/bootstrap_vars.yml"
    - "~/agof_vault.yml"
  vars:
    ansible_remote_tmp: "/home/{{ ansible_user | default('ec2-user') }}/.ansible/tmp"
  tasks:
    - name: "Wait for VM(s) to be ready for SSH"
      ansible.builtin.wait_for_connection:
        delay: 1
        timeout: 600

- name: Post-provisioning tasks
  hosts: aws_nodes
  become: true
  gather_facts: true
  vars_files:
    - "vars/aws_vars.yml"
    - "../vars/bootstrap_vars.yml"
    - "../../vars/main.yml"
    - "~/agof_vault.yml"
  vars:
    ec2_instances_built: "{{ hostvars['localhost']['ec2_instances_built'] }}"
    ipaclient_configure_dns_resolver: false
    ansible_remote_tmp: "/home/{{ ansible_user | default('ec2-user') }}/.ansible/tmp"
  tasks:
    - name: "Ensure remote tmp directory"
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.ansible/tmp"
        mode: '0700'
        owner: '{{ ansible_user }}'
        recurse: true

    - name: 'Ensure hostname-setting can persist (thanks, cloud-init)'
      ansible.builtin.lineinfile:
        path: '/etc/cloud/cloud.cfg'
        regexp: '^\s*preserve_hostname:'
        line: 'preserve_hostname: true'

    - name: Set hostnames
      ansible.builtin.hostname:
        name: '{{ short_hostname }}.{{ pattern_domain }}'

    - name: Set /etc/hosts
      ansible.builtin.copy:
        content: |
          127.0.0.1   localhost localhost.localdomain localhost4 localhost4.localdomain4
          ::1         localhost localhost.localdomain localhost6 localhost6.localdomain6

          {% for ib in ec2_instances_built %}
          {{ ib.private_ip_address }}        {{ ib.tags.avpname }}.{{ pattern_domain }} {{ ib.tags.avpaliases }}
          {% endfor %}
        dest: /etc/hosts
        owner: root
        group: root
        mode: '0644'

- name: Bootstrap RHEL nodes
  hosts: aws_nodes
  become: true
  gather_facts: true
  vars_files:
    - "vars/aws_vars.yml"
    - "../vars/bootstrap_vars.yml"
    - "../../vars/main.yml"
    - "~/agof_vault.yml"
  vars:
    ansible_remote_tmp: "/home/{{ ansible_user | default('ec2-user') }}/.ansible/tmp"
  tasks:
    - name: Register and prepare RHEL nodes for AAP install
      ansible.builtin.include_role:
        name: roles/bootstrap_rhel_node

- name: Switch controller hosts to AAP installer SSH user
  hosts: aap_controllers
  gather_facts: false
  vars_files:
    - "vars/aws_vars.yml"
    - "../vars/bootstrap_vars.yml"
    - "../../vars/main.yml"
    - "~/agof_vault.yml"
  tasks:
    - name: Update inventory to use AAP installer SSH user
      ansible.builtin.add_host:
        name: "{{ inventory_hostname }}"
        ansible_user: "{{ containerized_installer_user }}"
        ansible_remote_tmp: "{{ containerized_installer_user_home }}/.ansible/tmp"

    - name: Ensure ansible async directory exists for AAP installer user
      ansible.builtin.file:
        path: "{{ containerized_installer_user_home }}/.ansible/.async"
        state: directory
        owner: "{{ containerized_installer_user }}"
        group: "{{ containerized_installer_user }}"
        mode: "0700"

    - name: Reset SSH connection for AAP installer user
      ansible.builtin.meta: reset_connection
