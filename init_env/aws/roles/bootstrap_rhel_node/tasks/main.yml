---
- name: Register with Red Hat Subscription Manager
  community.general.redhat_subscription:
    state: present
    activationkey: "{{ activation_key }}"
    org_id: "{{ org_number }}"

- name: Install bootstrap packages
  ansible.builtin.package:
    name: "{{ bootstrap_packages }}"
    state: present

- name: Manage user for AAP installer
  ansible.builtin.user:
    name: "{{ containerized_installer_user }}"
    comment: "AAP User"
    create_home: true
    home: "{{ containerized_installer_user_home }}"

- name: Enable passwordless sudo for AAP installer user
  ansible.builtin.lineinfile:
    path: "/etc/sudoers.d/{{ containerized_installer_user }}"
    line: "{{ containerized_installer_user }} ALL=(ALL) NOPASSWD: ALL"
    owner: root
    group: root
    mode: "0444"
    create: true

- name: Set XDG_RUNTIME_DIR for AAP installer user
  ansible.builtin.lineinfile:
    path: "{{ containerized_installer_user_home }}/.bashrc"
    line: "export XDG_RUNTIME_DIR=/run/user/$EUID"
    create: true
    owner: "{{ containerized_installer_user }}"
    group: "{{ containerized_installer_user }}"
    mode: "0644"

- name: Ensure .ssh directory for AAP installer user
  ansible.builtin.file:
    path: "{{ containerized_installer_user_home }}/.ssh"
    state: directory
    owner: "{{ containerized_installer_user }}"
    group: "{{ containerized_installer_user }}"
    mode: "0700"

- name: Copy bootstrap user SSH trusted keys to AAP installer user
  ansible.builtin.copy:
    src: "{{ containerized_installer_bootstrap_user_home }}/.ssh/authorized_keys"
    dest: "{{ containerized_installer_user_home }}/.ssh/authorized_keys"
    remote_src: true
    owner: "{{ containerized_installer_user }}"
    group: "{{ containerized_installer_user }}"
    mode: "0600"

- name: Ensure ansible remote tmp for AAP installer user
  ansible.builtin.file:
    path: "{{ containerized_installer_user_home }}/.ansible/tmp"
    state: directory
    owner: "{{ containerized_installer_user }}"
    group: "{{ containerized_installer_user }}"
    mode: "0700"

- name: Ensure ansible async directory for AAP installer user
  ansible.builtin.file:
    path: "{{ containerized_installer_user_home }}/.ansible/.async"
    state: directory
    owner: "{{ containerized_installer_user }}"
    group: "{{ containerized_installer_user }}"
    mode: "0700"
